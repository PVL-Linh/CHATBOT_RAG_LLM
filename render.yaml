services:
  - type: web
    name: your-flask-app
    runtime: python3
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      # Nếu cần OCR packages
      # apt-get update && apt-get install -y tesseract-ocr tesseract-ocr-vie poppler-utils
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app --workers 2 --timeout 120
    plan: starter
    env: python
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2
    # System packages nếu cần OCR
    buildFilter:
      paths:
        - app.py
        - requirements.txt
        - src/**
        - src/templates/**
        - src/static/**
