services:
  - type: web
    name: tiximax-flask
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 8 --worker-class gthread --timeout 0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FLASK_DEBUG
        value: "false"
      - key: SECRET_KEY
        sync: false # điền trong Dashboard
      - key: API_KEY_MKT # (Gemini/Imagen…)
        sync: false
      - key: LOCAL_TZ
        value: Asia/Ho_Chi_Minh
      - key: SEM_LLM
        value: "24"
      - key: MAX_HISTORY
        value: "50"
    disk:
      name: app-instance
      mountPath: /opt/render/project/src/instance
      sizeGB: 2
