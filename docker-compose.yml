# docker-compose.yml
services:
  tiximax:
    container_name: tiximax
    build:
      context: .
      dockerfile: Dockerfile
    image: tiximax:local
    restart: unless-stopped
    ports:
      - "10000:10000"
    env_file:
      - ./.env
    environment:
      PORT: "${PORT:-10000}"
      WEB_THREADS: "${WEB_THREADS:-8}"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-1}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-120}"
      USERS_DB: /var/lib/tiximax/Data_app/users.db
      SQLITE_PATH: /var/lib/tiximax/Data_app/users.db
      CHAT_DB_PATH: /var/lib/tiximax/Data_app/chat.db
    volumes:
      - "E:/ChatAll/src/app/Data_app:/var/lib/tiximax/Data_app"
      - "E:/ChatAll/src/app/models:/var/lib/tiximax/models"
      - "E:/ChatAll/src/app/vectorstore:/var/lib/tiximax/vectorstore"
      - "E:/ChatAll/src/app/Data_app:/app/src/app/Data_app"
      - "E:/ChatAll/src/app/vectorstore/FAISS_Vector_HR:/var/lib/tiximax/vectorstore/FAISS_Vector_HR"
      - "E:/ChatAll/src/app/vectorstore/FAISS_Vector_ALL:/var/lib/tiximax/vectorstore/FAISS_Vector_ALL"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tiximax-tunnel
    restart: unless-stopped
    depends_on:
      - tiximax
    command: ["tunnel", "--no-autoupdate", "--url", "http://tiximax:10000"]
