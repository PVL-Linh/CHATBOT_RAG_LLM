<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập | Tiximax</title>
    <link rel="stylesheet" href="/static/css/login.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}" />
  </head>
  <body class="bg">
    <div class="card">
      <div class="brand">
        <img src="/static/images/logo.png" alt="Tiximax" />
      </div>
      <h2 class="title">Chào mừng đến Tiximax</h2>
      {% if error %}
        <div class="alert">{{ error }}</div>
      {% endif %}
      <form method="post" autocomplete="on">
        <input type="hidden" name="next" value="{{ next_url or '' }}" />
        <h4 class="label">Tài khoản</h4>
        <label class="field">
          <span class="icon">
            <!-- user icon -->
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-5.33 0-8 2.67-8 5v1h16v-1c0-2.33-2.67-5-8-5Z" />
            </svg>
          </span>
          <input name="username" type="text" placeholder="Nhập tài khoản..." required />
        </label>
        <h4 class="label">Mật khẩu</h4>
        <label class="field">
          <span class="icon">
            <!-- lock icon -->
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2Zm-6 0V7a2 2 0 0 1 4 0v2Z" />
            </svg>
          </span>

          <input id="password" name="password" type="password" placeholder="Nhập mật khẩu..." required />
          <button type="button" id="togglePwd" class="eye" aria-label="Hiện mật khẩu" title="Hiện mật khẩu">
            <!-- Mặc định: đang ẨN mật khẩu -->
            <span id="icon-hide" class="emoji" aria-hidden="true">🙊</span>
            <!-- Khi HIỆN mật khẩu -->
            <span id="icon-show" class="emoji" aria-hidden="true" style="display:none;">🙈</span>
          </button>
        </label>

        <div class="row">
          <label class="remember">
            <input type="checkbox" name="remember" />
            <span>Ghi nhớ tôi</span>
          </label>
          <a class="link" href="#" onclick="alert('Liên hệ admin để đặt lại mật khẩu.'); return false;">Quên mật khẩu?</a>
        </div>
        <button class="btn" type="submit">Đăng nhập</button>
      </form>
      <p class="help">Chưa có tài khoản? Liên hệ admin để được cấp quyền.</p>
    </div>
    <script src="/static/js/login.js"></script>
  </body>
</html>
