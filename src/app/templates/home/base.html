<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      {% block title %}
        Tiximax Home Page
      {% endblock %}
    </title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap-5.3.8-dist/css/bootstrap.min.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css', v="1") }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebarv1.css', v="1") }}" />
    {% block page_css %}

    {% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" />
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <!-- Giảm độ trễ kết nối CDN -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://unpkg.com" crossorigin />

    <!-- CSS cho highlight -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" />

    {% block extra_head %}

    {% endblock %}
  </head>
  <body style="max-height: 100vh">
    <div class="layout">
      {% include 'partials/sidebar.html' %}

      <section class="main">
        <!-- Topbar: biến thành block để trang con có thể ẩn -->
 
        {% block content %}
        {% endblock %} 
        {% block footer %}

        {% endblock %}
      </section>
    </div>

    <!-- JS dùng chung -->
    <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <script defer src="https://unpkg.com/lucide@latest"></script>
    <script src="{{ url_for('static', filename='js/index.js', v="1") }}"></script>
    <script defer src="{{ url_for('static', filename='js/sidebarv1.js', v="1") }}"></script>
    {# script của Marketing sẽ đưa vào extra_scripts ở trang marketing.html #}
    <script defer>
      document.addEventListener('DOMContentLoaded', () => {
        if (window.hljs) hljs.highlightAll()
        if (window.lucide) lucide.createIcons()
      })
      window.TXM_USER = "{{ (current_user or session.get('user')) | e }}"
    </script>
    {% block extra_scripts %}

    {% endblock %}
  </body>
</html>
