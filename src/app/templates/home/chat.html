{% extends "home/base.html" %}
{% block title %}Tiximax Chatbot{% endblock %}
{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/chat/chat.css') }}" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/chat/history-chat.css') }}" />
<style>
  .chat-preview {
    font-size: 13px;
    color: #666;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
</style>
{% endblock %}
{% block content %}
<!-- History Toggle Button -->
<button class="history-toggle" id="historyToggle">
  <i data-lucide="message-square"></i>
</button>
<button class="newchat-toggle" id="newChatBtn" title="Cuộc trò chuyện mới">
  <i data-lucide="plus"></i>
</button>
<!-- Sidebar Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Chat History Sidebar -->
<div class="chat-sidebar slim" id="chatSidebar">
  <div class="sidebar-header">
    <div class="sidebar-title">
      <i data-lucide="history"></i>
      Chat History
    </div>
  </div>

  <div class="search-container">
    <input type="text" class="search-input" placeholder="Tìm kiếm cuộc trò chuyện..." id="searchInput">
  </div>

  <div class="chat-history" id="chatHistory">
    <!-- Chat items will be dynamically inserted here -->
  </div>
</div>

<main class="container-fluid px-2 px-sm-3 px-lg-4 d-flex flex-column h-100">
  <div class="row justify-content-center flex-grow-1 h-100">
    <div class="col-12 col-md-11 col-lg-10 col-xl-9 col-xxl-8 d-flex flex-column h-100 gap-3" id="chatShell">
      <div class="flex-grow-1 overflow-auto" id="chatScroll" tabindex="-1">
        <ul id="chatList" class="chat-list mb-3"></ul>
        <div id="greeting" class="greeting"></div>
      </div>
      <footer class="composer position-sticky bottom-0">
        <form id="chatForm" class="composer-inner">
          <div class="input-wrap">
            <textarea id="chatInput" rows="1" placeholder="Ask anything about Tiximax Company" autocomplete="off"></textarea>
            <button id="sendBtn" class="send-btn" type="submit" title="Gửi">
              <i data-lucide="send"></i>
            </button>
          </div>
        </form>
      </footer>
    </div>
  </div>
</main>
{% endblock %}
{% block extra_scripts %}
  <script defer src="{{ url_for('static', filename='js/chat/chat.js') }}"></script>
{% endblock %}
