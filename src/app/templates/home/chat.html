{% extends "home/base.html" %} {% block title %}Tiximax Chatbot{% endblock %} {%
block topbar %}
<header class="topbar">
  <div class="tb-right">
    <!-- Nút mở lịch sử chat -->
    <button id="historyBtn" class="btn-outline">
      <i data-lucide="history"></i> Lịch sử
    </button>
  </div>
</header>
{% endblock %} {% block history_panel %}
<div id="overlay" class="overlay" aria-hidden="true"></div>
<aside id="historyPanel" class="history-panel" aria-label="Lịch sử chat">
  <div class="hp-toolbar">
    <button id="newSessionTop" class="btn-block" title="Tạo đoạn chat mới">
      <i data-lucide="plus"></i> Thêm đoạn chat
    </button>
  </div>
  <div class="hp-header">
    <div class="hp-actions">
      <button id="newSession" class="btn-sm" title="Tạo đoạn chat mới">
        <i data-lucide="square-pen"></i> New Chat
      </button>
      <button id="closeHistory" class="icon-btn" title="Đóng">
        <i data-lucide="x"></i>
      </button>
    </div>
  </div>
  <ul id="historyList" class="hp-list"></ul>
  <div class="hp-footer">
    <small>Mẹo: bấm tên để mở. Dùng ✏️ để đổi tên, 🗑️ để xóa.</small>
  </div>
</aside>
{% endblock %} {% block content %}
<main class="chat-area">
  <div class="chat-container">
    <ul id="chatList" class="chat-list"></ul>
    <!-- Greeting card -->
    <div id="greeting" class="greeting"></div>
  </div>
</main>

<!-- Composer -->
<footer class="composer">
  <form id="chatForm" class="composer-inner">
    <div class="left-tools">
      <button type="button" class="icon-btn" id="attachBtn" title="Đính kèm">
        <i data-lucide="plus"></i>
      </button>
      <div class="chips">
        <button type="button" class="chip" data-action="search">
          <i data-lucide="globe"></i><span>Search</span>
        </button>
        <button type="button" class="chip" data-action="deep">
          <i data-lucide="layers"></i><span>Deep Research</span>
        </button>
        <button type="button" class="chip" data-action="image">
          <i data-lucide="image-plus"></i><span>Create Images</span>
        </button>
        <button type="button" class="icon-btn" title="Thêm">
          <i data-lucide="ellipsis"></i>
        </button>
      </div>
    </div>
    <div class="input-wrap">
      <textarea
        id="chatInput"
        rows="1"
        placeholder="Enter Question..."
      ></textarea>
      <button id="sendBtn" class="send-btn" type="submit" title="Gửi">
        <i data-lucide="send"></i>
      </button>
    </div>
  </form>
</footer>
{% endblock %}
