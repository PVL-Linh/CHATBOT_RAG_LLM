<!-- History Toggle Button -->
<button class="history-toggle" id="historyToggle"><i data-lucide="message-square"></i></button>
<!-- Sidebar Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<!-- Chat History Sidebar -->
<div class="chat-sidebar slim" id="chatSidebar">
  <div class="sidebar-header">
    <div class="sidebar-title">
      <i data-lucide="history"></i>
      Chat History
    </div>

    <!-- NÚT + trong header -->
    <div class="sidebar-actions">
      <button class="newchat-toggle" id="newChatBtn" title="Cuộc trò chuyện mới"><i data-lucide="plus"></i></button>
    </div>
  </div>

  <div class="search-container">
    <input type="text" class="search-input" placeholder="Tìm kiếm cuộc trò chuyện..." id="searchInput" />
  </div>
  <div class="chat-history" id="chatHistory">
    <!-- Chat items will be dynamically inserted here -->
  </div>
</div>
